name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions auf Commit-SHA festgelegt (Versionen im Kommentar, Aktualisierung über Dependabot)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/synchrothek-server
          path: synchrothek-server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Protokoll mit Server abgleichen
        run: npm run sync-protocol -- --check
        env:
          SYNCHROTHEK_SERVER_DIR: ${{ github.workspace }}/synchrothek-server
      - run: npm run build && npm run build:firefox
      - name: Firefox-Paket prüfen (web-ext lint)
        run: npx --yes web-ext lint -s .output/firefox-mv3
      - name: E2E-Test
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          (cd synchrothek-server && npm ci --omit=dev)
          npx playwright install --with-deps chromium
          npm run e2e:setup
          npm run test:e2e
        env:
          SYNCHROTHEK_SERVER_DIR: ${{ github.workspace }}/synchrothek-server
